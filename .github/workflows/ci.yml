name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  landing:
    name: Landing Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Verify repo hygiene
        run: scripts/verify_repo_hygiene.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Verify landing
        working-directory: landing
        run: npm run verify

  macos:
    name: macOS App
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Verify macOS app
        run: scripts/verify_app.sh
